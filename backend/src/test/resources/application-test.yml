# Integration tests run against a real Postgres database (create it with scripts/db-setup.sh or
# docker compose). Override with TEST_DB_URL / DB_USERNAME / DB_PASSWORD, e.g. in CI.
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/project_untitled_test}

app:
  security:
    jwt-secret: test-only-jwt-secret-0123456789abcdef0123456789
    cookie-secure: false
  otp:
    hash-secret: test-only-otp-secret-0123456789abcdef0123456789
  mail:
    delivery: log

logging:
  level:
    com.projectuntitled: INFO
