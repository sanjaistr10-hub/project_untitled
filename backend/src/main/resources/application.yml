# Shared settings. Secrets are NOT set here:
#   - local dev:  application-dev.yml (active by default)
#   - production: SPRING_PROFILES_ACTIVE=prod + environment variables (see application-prod.yml)
spring:
  application:
    name: project-untitled-backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/project_untitled}
    username: ${DB_USERNAME:project_untitled}
    password: ${DB_PASSWORD:project_untitled}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks it matches.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # An SMTP outage shouldn't mark the API as down (sign-in codes fail loudly on their own).
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

app:
  brand-name: Project Untitled
  frontend:
    app-url: http://localhost:3100
    # Where a community's white-label site lives. Override with APP_FRONTEND_MEMBERSITEURLTEMPLATE.
    member-site-url-template: "http://{slug}.localhost:3100"
  security:
    jwt-issuer: project-untitled
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    cookie-secure: true
  otp:
    length: 6
    ttl: 10m
    resend-cooldown: 30s
    max-attempts: 5
    max-sends-per-hour: 5
  mail:
    delivery: smtp
    from-address: no-reply@example.com
